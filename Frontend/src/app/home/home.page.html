<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="header-content">
      <img src="assets/images/logo.jpg" alt="Logo" class="logo" [routerLink]="['/home']">

      <!-- Menu avec bouton Produit, Carton, Palette -->
      <div class="menu-buttons">
        <ion-button fill="clear" [routerLink]="['/creer-data-sachet']">Produit</ion-button>
        <ion-button fill="clear" [routerLink]="['/creer-data-carton']">Carton</ion-button>
        <ion-button fill="clear" [routerLink]="['/creer-data-palette']">Palette</ion-button>
      </div>

      <!-- Bouton de Déconnexion, séparé des autres boutons -->
      <ion-button fill="clear" (click)="logout()" class="logout-button">Déconnexion</ion-button>
    </div>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  
  <!-- Hero Section -->
  <section class="hero">
    <h1>Bienvenue sur notre service <br> de gestion d'étiquettes</h1>
    <p>Générez facilement des étiquettes pour vos produits, cartons et palettes.</p>
    <img src="https://img.freepik.com/vecteurs-libre/code-qr-boite_78370-5864.jpg?t=st=1742522744~exp=1742526344~hmac=31eade07b252c547c09727b6a6525ac3f705fca1ebd592426fe93886477a5ee0&w=900" alt="Image code Qr sur boîte" width="350" srcset="">
  </section>

  <!-- Image Slider Section -->
  <div class="content-container">
    <div class="slider-container">
      <swiper-container autoplay="true" loop="true" speed="1000">
        <swiper-slide>
          <div class="slide-content">
            <img src="https://i0.wp.com/innofaso.com/wp-content/uploads/2018/07/DSC_9636.jpg?fit=1200%2C704&ssl=1" alt="Image 1">
          </div>
        </swiper-slide>
        <swiper-slide>
          <div class="slide-content">
            <img src="https://th.bing.com/th?id=OLC.qKKZ1RdX/YhgdA480x360&rs=1&pid=ImgDetMain" alt="Image 2">
          </div>
        </swiper-slide>
        <swiper-slide>
          <div class="slide-content">
            <img src="https://i0.wp.com/innofaso.com/wp-content/uploads/2020/10/DSC_2102nn.jpg?resize=1170%2C603&ssl=1" alt="Image 3">
          </div>
        </swiper-slide>
        <swiper-slide>
          <div class="slide-content">
            <img src="https://www.groupenutriset.fr/wp-content/uploads/2023/12/CX_PNUT-2-1024x768.png" alt="Image 4">
          </div>
        </swiper-slide>
      </swiper-container>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="footer-content">
      <p>&copy; 2026. Tous droits réservés Groupe 2 PING ISGE 2024-2025.</p>
    </div>
  </ion-toolbar>
</ion-footer>
