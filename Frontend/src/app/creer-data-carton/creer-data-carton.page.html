<ion-header [translucent]="true">
      <ion-toolbar>
        <div class="header-content">
          <img src="assets/images/logo.jpg" alt="Logo" class="logo" [routerLink]="['/home']">
          <div class="floating-menu">
            <ion-button fill="clear" [routerLink]="['/creer-data-sachet']">Produit</ion-button>
            <ion-button fill="clear" [routerLink]="['/creer-data-carton']">Carton</ion-button>
            <ion-button fill="clear" [routerLink]="['/creer-data-palette']">Palette</ion-button>
          </div>
        </div>
        <ion-title>Générer une étiquette carton</ion-title>
      </ion-toolbar>
    </ion-header>

<ion-content class="ion-padding">
  <form (submit)="generateLabel()">
    <ion-item>
      <ion-label position="floating">GTIN</ion-label>
      <ion-input [(ngModel)]="carton.gtin" name="gtin" required></ion-input>

    </ion-item>

    <ion-item>
      <ion-label position="floating">Content GTIN</ion-label>
      <ion-input [(ngModel)]="carton.content_gtin" name="content_gtin" required></ion-input>

    </ion-item>

    <ion-item>
      <ion-label position="floating">Batch</ion-label>

      <ion-input [(ngModel)]="carton.batch" name="batch" required></ion-input>

    </ion-item>

    <ion-item>
      <ion-label position="floating">Expiry Date (JJ/MM/AA)</ion-label>

      <ion-input [(ngModel)]="carton.expiry_date" name="expiry_date" type="date" required></ion-input>

    </ion-item>

    <ion-item>
      <ion-label position="floating">Quantity</ion-label>
      <ion-input type="number" [(ngModel)]="carton.quantity" name="quantity" required></ion-input>

    </ion-item>

    <ion-button expand="full" type="submit">Générer l'étiquette</ion-button>
  </form>

  <div *ngIf="labelUrl">
    <h3>Aperçu de l'étiquette</h3>
    <img [src]="labelUrl" alt="Étiquette générée">
    <ion-button expand="full" (click)="downloadLabel()">Télécharger l'étiquette</ion-button>
  </div>
</ion-content>
